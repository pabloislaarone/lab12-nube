server:
  port: 8081

spring:
  application:
    name: marcador-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marcador}
    username: ${DB_USER:marcador}
    password: ${DB_PASSWORD:marcador}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: marcador-worker
      replica: ${worker.instance-id}

worker:
  instance-id: ${HOSTNAME:worker-local}
  scoring:
    exact-points: ${SCORING_EXACT:5}
    winner-points: ${SCORING_WINNER:3}
    goal-diff-points: ${SCORING_GOAL_DIFF:2}
    streak-length: ${SCORING_STREAK_LENGTH:3}
    streak-bonus: ${SCORING_STREAK_BONUS:2}
    early-bonus: ${SCORING_EARLY_BONUS:1}
    early-threshold-hours: ${SCORING_EARLY_HOURS:24}
    last-minute-window-minutes: ${SCORING_LAST_MINUTE:10}
    combine-mode: ${SCORING_COMBINE_MODE:HIGHEST}
    early-bonus-requires-hit: ${SCORING_EARLY_REQUIRES_HIT:true}

logging:
  pattern:
    level: "%5p [${worker.instance-id}]"
