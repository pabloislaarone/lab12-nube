name: polla-mundialista

# Variables comunes de la API y el worker
x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polla}
  DB_USER: ${POSTGRES_USER:-polla}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-polla}
  REDIS_HOST: redis
  RABBIT_HOST: rabbitmq
  RABBIT_USER: ${RABBITMQ_USER:-polla}
  RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-polla}
  SCORING_COMBINE_MODE: ${SCORING_COMBINE_MODE:-HIGHEST}

services:
  # ---------------- Datos y mensajería ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polla}
      POSTGRES_USER: ${POSTGRES_USER:-polla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polla}
    command: postgres -c max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polla} -d ${POSTGRES_DB:-polla}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-polla}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-polla}
    ports:
      - "15672:15672"   # consola web de RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------- Aplicación ----------------
  api:
    build:
      context: ./backend
      args:
        MODULE: api
    image: polla-api:latest
    environment:
      <<: *backend-env
      JWT_SECRET: ${JWT_SECRET:-polla-mundialista-tecsup-secreto-de-desarrollo-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@polla.pe}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-15}
    deploy:
      # Escalamiento horizontal: varias réplicas idénticas y sin estado
      replicas: ${API_REPLICAS:-3}
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        MODULE: worker
    image: polla-worker:latest
    environment:
      <<: *backend-env
      DB_POOL_SIZE: 5
    deploy:
      # Varias réplicas compiten por los mensajes de la cola (competing consumers)
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy   # la API aplica las migraciones de Flyway

  # ---------------- Balanceador + frontend ----------------
  gateway:
    build: ./frontend
    image: polla-gateway:latest
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # ---------------- Pruebas de estrés (perfil "stress") ----------------
  k6:
    image: grafana/k6:0.54.0
    profiles: ["stress"]
    environment:
      BASE_URL: http://gateway
    volumes:
      - ./k6:/scripts:ro
      - ./docs/resultados:/results
    depends_on:
      - gateway

  # ---------------- Monitoreo (perfil "monitoring") ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
