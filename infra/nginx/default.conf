# Nginx cumple dos funciones:
#   1) Sirve el frontend (React compilado).
#   2) Balancea la carga de /api/ entre todas las réplicas de la API.

# DNS interno de Docker: devuelve una IP por cada réplica del servicio "api"
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    # Envía cada petición a la réplica con menos conexiones activas
    least_conn;
    # "resolve" vuelve a consultar el DNS: si se escala a 1, 3 o 5 réplicas, Nginx se entera solo
    server api:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 64;
}

# Formato de log que muestra qué réplica atendió cada petición
log_format balanceo '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log balanceo;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Tiempo real (Server-Sent Events): sin buffer y con conexión larga
    location = /api/stream {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Upstream $upstream_addr always;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Si una réplica cae, la petición se reintenta en otra (solo GET/HEAD)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header X-Upstream $upstream_addr always;
    }

    # Estado básico de Nginx (conexiones activas)
    location = /nginx-status {
        stub_status;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta del frontend devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
